name: Build and publish to GitHub Pages

# Builds the app on every push to main and publishes it to the gh-pages
# branch, which GitHub Pages serves at https://<owner>.github.io/map-stylizer/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      # Pushes made with the workflow token don't start a Pages build on
      # their own, so ask for one explicitly.
      - name: Request a Pages build
        run: |
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          echo "::notice title=Pages build request::HTTP $code $(tr -d '\n' < resp.json | head -c 300)"
          [ "$code" -lt 300 ]
